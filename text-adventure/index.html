<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Adventure Game</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="terminal">
        <div id="keyboard-legend">
            <div class="legend-title">KEYBOARD COMMANDS</div>
            <div class="legend-grid">
                <div class="legend-item">ARROW KEYS: Move</div>
                <div class="legend-item">SPACE: Action</div>
                <div class="legend-item">G: Get Item</div>
                <div class="legend-item">D: Drop Item</div>
                <div class="legend-item">I: Inventory</div>
                <div class="legend-item">L: Look Around</div>
                <div class="legend-item">X: Examine</div>
                <div class="legend-item">M: Mission Status</div>
                <div class="legend-item">H: Help</div>
            </div>
        </div>
        
        <div id="game-screen">
            <div id="output"></div>
            <div id="prompt-line">
                <span id="prompt">&gt; </span>
                <span id="cursor">_</span>
            </div>
        </div>
    </div>

    <script src="./game.js"></script>
</body>
</html>
